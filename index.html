      // ==========================================
      // 3. Web Audio API 사운드 합성기 (즉시 인지 피드백)
      // ==========================================
      class SoundManager {
        constructor() {
          this.ctx = null;
          this.enabled = true;
        }

        getContext() {
          if (!this.enabled || typeof window === "undefined") return null;
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === "suspended") {
            this.ctx.resume();
          }
          return this.ctx;
        }

        playTypeSound() {
          try {
            const ctx = this.getContext();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(600 + Math.random() * 80, ctx.currentTime);
            gain.gain.setValueAtTime(0.04, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.04);
          } catch {}
        }

        playCorrectSound() {
          try {
            const ctx = this.getContext();
            if (!ctx) return;
            const now = ctx.currentTime;
            [523.25, 659.25, 783.99].forEach((freq, idx) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = "triangle";
              osc.frequency.setValueAtTime(freq, now + idx * 0.06);
              gain.gain.setValueAtTime(0.08, now + idx * 0.06);
              gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.18);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + idx * 0.06);
              osc.stop(now + idx * 0.06 + 0.2);
            });
          } catch {}
        }

        playErrorSound() {
          try {
            const ctx = this.getContext();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(140, ctx.currentTime);
            gain.gain.setValueAtTime(0.06, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
          } catch {}
        }

        playStageClearSound() {
          try {
            const ctx = this.getContext();
            if (!ctx) return;
            const now = ctx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.5];
            notes.forEach((freq, i) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = "sine";
              osc.frequency.setValueAtTime(freq, now + i * 0.1);
              gain.gain.setValueAtTime(0.12, now + i * 0.1);
              gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.35);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + i * 0.1);
              osc.stop(now + i * 0.1 + 0.4);
            });
          } catch {}
        }
      }

      const soundManager = new SoundManager();

      // ==========================================
      // 4. 메인 App 컴포넌트
      // ==========================================
      function App() {
        // Game State
        const [currentStageIdx, setCurrentStageIdx] = useState(0); // 0 to 4 (5 stages)
        const [currentWordIdx, setCurrentWordIdx] = useState(0); // 0 to 9 (10 words per stage)
        const [inputValue, setInputValue] = useState("");
        const [score, setScore] = useState(0);
        const [hasWordError, setHasWordError] = useState(false);
        const [soundEnabled, setSoundEnabled] = useState(true);

        // Background Music (pixel-rush.mp3 경로 자동 감지 로더)
        const [bgmPlaying, setBgmPlaying] = useState(false);
        const bgmRef = useRef(null);

        useEffect(() => {
          // 로컬 더블클릭, GitHub Pages, 또는 public 경로 유연 감지
          const audio = new Audio();
          const candidatePaths = [
            "./pixel-rush.mp3",
            "pixel-rush.mp3",
            "../public/pixel-rush.mp3",
            "./public/pixel-rush.mp3",
            "/pixel-rush.mp3",
          ];
          let pathIndex = 0;

          audio.src = candidatePaths[pathIndex];
          audio.loop = true;
          audio.volume = 0.35;

          audio.onerror = () => {
            pathIndex++;
            if (pathIndex < candidatePaths.length) {
              audio.src = candidatePaths[pathIndex];
              audio.load();
            }
          };

          bgmRef.current = audio;

          return () => {
            audio.pause();
            audio.src = "";
          };
        }, []);

        // Unlock BGM on first user interaction
        useEffect(() => {
          const startBgmOnGesture = () => {
            if (bgmRef.current && bgmRef.current.paused && soundEnabled) {
              bgmRef.current
                .play()
                .then(() => setBgmPlaying(true))
                .catch(() => {});
            }
          };

          window.addEventListener("click", startBgmOnGesture, { once: true });
          window.addEventListener("keydown", startBgmOnGesture, { once: true });

          return () => {
            window.removeEventListener("click", startBgmOnGesture);
            window.removeEventListener("keydown", startBgmOnGesture);
          };
        }, [soundEnabled]);

        const toggleBgm = () => {
          if (!bgmRef.current) return;
          if (bgmPlaying) {
            bgmRef.current.pause();
            setBgmPlaying(false);
          } else {
            bgmRef.current
              .play()
              .then(() => setBgmPlaying(true))
              .catch((err) => console.warn("BGM playback error:", err));
          }
        };

        // Speed and Accuracy tracking
        const [totalKeystrokes, setTotalKeystrokes] = useState(0);
        const [correctKeystrokes, setCorrectKeystrokes] = useState(0);
        const [startTime, setStartTime] = useState(null);
        const [currentTime, setCurrentTime] = useState(Date.now());
        const [typedHistory, setTypedHistory] = useState([]);

        // Feedback states
        const [shake, setShake] = useState(false);
        const [showStageSuccess, setShowStageSuccess] = useState(false);
        const [isGameFinished, setIsGameFinished] = useState(false);
        const [creditsPaused, setCreditsPaused] = useState(false);
        const [viewPreviousVersion, setViewPreviousVersion] = useState(false);

        // Player name & Record management
        const [playerName, setPlayerName] = useState("");
        const [nameError, setNameError] = useState("");
        const [isRecordSaved, setIsRecordSaved] = useState(false);
        const [showHallOfFame, setShowHallOfFame] = useState(false);
        const [showClearConfirm, setShowClearConfirm] = useState(false);
        const [lastSavedId, setLastSavedId] = useState(null);
        const [savedRecords, setSavedRecords] = useState(() => {
          try {
            const raw = localStorage.getItem("typingRanking");
            return raw ? JSON.parse(raw) : [];
          } catch {
            return [];
          }
        });

        // Stage-based word exposure timer (1단계 9초, 단계마다 1초씩 감소)
        const maxWordTimeSec = Math.max(9 - currentStageIdx, 1);
        const [wordTimeLeft, setWordTimeLeft] = useState(9);
        const isWordHidden = wordTimeLeft <= 0;

        const inputRef = useRef(null);
        const isComposingRef = useRef(false);
        const currentStage = HOLLYWOOD_STAGES[currentStageIdx];
        const currentActor = currentStage?.actors[currentWordIdx];

        useEffect(() => {
          setWordTimeLeft(Math.max(9 - currentStageIdx, 1));
        }, [currentStageIdx, currentWordIdx]);

        useEffect(() => {
          if (isGameFinished || showStageSuccess) return;

          const interval = setInterval(() => {
            setWordTimeLeft((prev) => {
              if (prev <= 0.05) return 0;
              return Math.max(0, +(prev - 0.1).toFixed(1));
            });
          }, 100);

          return () => clearInterval(interval);
        }, [currentStageIdx, currentWordIdx, isGameFinished, showStageSuccess]);

        useEffect(() => {
          if (!startTime || isGameFinished) return;
          const interval = setInterval(() => {
            setCurrentTime(Date.now());
          }, 400);
          return () => clearInterval(interval);
        }, [startTime, isGameFinished]);

        useEffect(() => {
          if (!isGameFinished && !showStageSuccess) {
            const timer = setTimeout(() => {
              inputRef.current?.focus();
            }, 15);
            return () => clearTimeout(timer);
          }
        }, [currentWordIdx, currentStageIdx, showStageSuccess, isGameFinished]);

        const handleToggleSound = () => {
          const next = !soundEnabled;
          setSoundEnabled(next);
          soundManager.enabled = next;
          if (bgmRef.current) {
            if (next) {
              bgmRef.current.play().then(() => setBgmPlaying(true)).catch(() => {});
            } else {
              bgmRef.current.pause();
              setBgmPlaying(false);
            }
          }
        };

        const cpm = useMemo(() => {
          if (!startTime) return 0;
          const elapsedMinutes = Math.max((currentTime - startTime) / 60000, 0.05);
          const speed = Math.round(correctKeystrokes / elapsedMinutes);
          return isNaN(speed) ? 0 : Math.min(speed, 1200);
        }, [startTime, currentTime, correctKeystrokes]);

        const accuracy = useMemo(() => {
          if (totalKeystrokes === 0) return 100;
          const acc = Math.round((correctKeystrokes / totalKeystrokes) * 100);
          return Math.min(Math.max(acc, 0), 100);
        }, [correctKeystrokes, totalKeystrokes]);

        const totalStages = HOLLYWOOD_STAGES.length;
        const wordsPerStage = 10;
        const overallWordIndex = currentStageIdx * wordsPerStage + currentWordIdx + 1;
        const totalWords = totalStages * wordsPerStage;

        const handleWordComplete = (wasPerfect) => {
          if (!currentActor) return;

          if (wasPerfect) {
            setScore((s) => s + 1);
            soundManager.playCorrectSound();
          } else {
            soundManager.playCorrectSound();
          }

          setTypedHistory((prev) => [
            ...prev,
            { actor: currentActor, isPerfect: wasPerfect, stage: currentStageIdx + 1 },
          ]);

          if (inputRef.current) {
            inputRef.current.value = "";
            inputRef.current.blur();
          }
          isComposingRef.current = false;
          setInputValue("");
          setHasWordError(false);

          if (currentWordIdx + 1 < wordsPerStage) {
            setCurrentWordIdx((w) => w + 1);
          } else {
            soundManager.playStageClearSound();
            if (currentStageIdx + 1 < totalStages) {
              setShowStageSuccess(true);
              setTimeout(() => {
                setShowStageSuccess(false);
                setCurrentStageIdx((s) => s + 1);
                setCurrentWordIdx(0);
              }, 1800);
            } else {
              setIsGameFinished(true);
            }
          }
        };

        const handleChange = (e) => {
          if (!startTime) {
            setStartTime(Date.now());
          }

          const val = e.target.value;
          const targetName = currentActor?.nameKo || "";

          setTotalKeystrokes((k) => k + 1);
          soundManager.playTypeSound();

          let mistakeFound = false;
          for (let i = 0; i < val.length; i++) {
            if (i >= targetName.length || val[i] !== targetName[i]) {
              mistakeFound = true;
              break;
            }
          }

          if (mistakeFound) {
            setHasWordError(true);
            setShake(true);
            soundManager.playErrorSound();
            setTimeout(() => setShake(false), 300);
          } else {
            setCorrectKeystrokes((c) => c + 1);
          }

          setInputValue(val);

          if (val === targetName) {
            handleWordComplete(!hasWordError && !mistakeFound);
          }
        };

        const handleKeyDown = (e) => {
          if (e.key === "Enter") {
            const trimmed = inputValue.trim();
            const targetName = currentActor?.nameKo || "";
            if (trimmed === targetName) {
              handleWordComplete(!hasWordError);
            } else {
              setShake(true);
              soundManager.playErrorSound();
              setTimeout(() => setShake(false), 300);
            }
          }
        };

        const handleSaveRecord = () => {
          if (isRecordSaved) return;

          const trimmed = playerName.trim();
          if (!trimmed) {
            setNameError("이름을 입력해 주세요");
            soundManager.playErrorSound();
            return;
          }

          setNameError("");

          const now = new Date();
          const year = now.getFullYear();
          const month = String(now.getMonth() + 1).padStart(2, "0");
          const day = String(now.getDate()).padStart(2, "0");
          const hours = String(now.getHours()).padStart(2, "0");
          const minutes = String(now.getMinutes()).padStart(2, "0");
          const formattedDate = `${year}.${month}.${day} ${hours}:${minutes}`;

          const newRecordId = `rec-${Date.now()}`;
          const newRecord = {
            id: newRecordId,
            date: formattedDate,
            name: trimmed,
            score: score,
          };

          try {
            const raw = localStorage.getItem("typingRanking");
            const existing = raw ? JSON.parse(raw) : [];
            const withIds = existing.map((item, idx) => ({
              id: item.id || `rec-old-${idx}-${item.date}`,
              ...item,
            }));

            const combined = [...withIds, newRecord];
            combined.sort((a, b) => b.score - a.score);
            const top10 = combined.slice(0, 10);
            localStorage.setItem("typingRanking", JSON.stringify(top10));
            setSavedRecords(top10);
            setLastSavedId(newRecordId);
          } catch (e) {
            console.warn("Save record error:", e);
          }

          setIsRecordSaved(true);
          soundManager.playStageClearSound();
        };

        const handleRestart = () => {
          setCurrentStageIdx(0);
          setCurrentWordIdx(0);
          if (inputRef.current) {
            inputRef.current.value = "";
          }
          isComposingRef.current = false;
          setInputValue("");
          setScore(0);
          setHasWordError(false);
          setTotalKeystrokes(0);
          setCorrectKeystrokes(0);
          setStartTime(null);
          setCurrentTime(Date.now());
          setTypedHistory([]);
          setWordTimeLeft(9);
          setPlayerName("");
          setNameError("");
          setIsRecordSaved(false);
          setLastSavedId(null);
          setIsGameFinished(false);
          setShowStageSuccess(false);
        };

        const handleClearAllRecords = () => {
          try {
            localStorage.removeItem("typingRanking");
          } catch (e) {
            console.warn("Storage clear error:", e);
          }
          setSavedRecords([]);
          setLastSavedId(null);
          setShowClearConfirm(false);
          soundManager.playErrorSound();
        };

        const handleDownloadRanking = () => {
          if (savedRecords.length === 0) return;

          const now = new Date();
          const year = now.getFullYear();
          const month = String(now.getMonth() + 1).padStart(2, "0");
          const day = String(now.getDate()).padStart(2, "0");
          const hours = String(now.getHours()).padStart(2, "0");
          const minutes = String(now.getMinutes()).padStart(2, "0");
          const fileName = `${year}${month}${day}_${hours}${minutes}_typeRanking.json`;

          const dataToExport = rankedRecords.map(({ rank, name, score, date }) => ({
            rank,
            name,
            score,
            date,
          }));

          const blob = new Blob([JSON.stringify(dataToExport, null, 2)], {
            type: "application/json;charset=utf-8",
          });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = fileName;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
          soundManager.playCorrectSound();
        };

        const rankedRecords = useMemo(() => {
          const sorted = [...savedRecords].sort((a, b) => b.score - a.score).slice(0, 10);

          let currentRank = 1;
          return sorted.map((item, idx) => {
            if (idx > 0) {
              if (item.score === sorted[idx - 1].score) {
                // 점수 같으면 동일 순위
              } else {
                currentRank = idx + 1;
              }
            } else {
              currentRank = 1;
            }

            const isMyRecent = Boolean(
              (lastSavedId && item.id === lastSavedId) ||
              (isRecordSaved && item.name === playerName.trim() && item.score === score)
            );

            return {
              ...item,
              rank: currentRank,
              isMyRecent,
            };
          });
        }, [savedRecords, lastSavedId, isRecordSaved, playerName, score]);

        const renderCharacterFeedback = () => {
          if (!currentActor) return null;
          const target = currentActor.nameKo;

          return (
            <div className="flex flex-wrap items-center justify-center gap-1.5 sm:gap-2 my-4">
              {target.split("").map((char, index) => {
                const typedChar = inputValue[index];
                let colorClass = "text-zinc-500 bg-zinc-900/80 border-zinc-800";
                let isCurrent = false;

                if (typedChar !== undefined) {
                  if (typedChar === char) {
                    colorClass = "text-amber-400 bg-amber-950/40 border-amber-500/60 shadow-[0_0_12px_rgba(245,158,11,0.25)]";
                  } else {
                    colorClass = "text-rose-400 bg-rose-950/50 border-rose-500 animate-pulse";
                  }
                } else if (index === inputValue.length) {
                  colorClass = "text-white bg-zinc-800 border-amber-400/80 ring-2 ring-amber-400/30";
                  isCurrent = true;
                }

                if (char === " ") {
                  return (
                    <span
                      key={index}
                      className={`inline-flex items-center justify-center w-7 h-12 sm:w-9 sm:h-14 rounded-lg border text-xs font-mono transition-all duration-150 ${colorClass}`}
                      title="띄어쓰기"
                    >
                      ␣
                    </span>
                  );
                }

                const isCharHidden = isWordHidden && typedChar === undefined;

                return (
                  <span
                    key={index}
                    className={`inline-flex items-center justify-center min-w-[36px] sm:min-w-[44px] h-12 sm:h-14 px-2 rounded-xl border text-xl sm:text-2xl font-bold tracking-wider transition-all duration-200 relative select-none ${
                      isCharHidden
                        ? "bg-zinc-900/90 text-zinc-600 border-dashed border-zinc-700/80 shadow-inner"
                        : colorClass
                    }`}
                  >
                    {isCharHidden ? (
                      <span className="text-zinc-500 font-mono text-lg animate-pulse">?</span>
                    ) : (
                      char
                    )}
                    {isCurrent && (
                      <span className="absolute -bottom-1 left-1/2 -translate-x-1/2 w-4 h-0.5 bg-amber-400 rounded-full animate-ping" />
                    )}
                  </span>
                );
              })}
            </div>
          );
        };

        return (
          <div className="min-h-screen bg-zinc-950 text-zinc-100 flex flex-col selection:bg-amber-500 selection:text-black">
            {/* Background Decorative Ambience */}
            <div className="fixed inset-0 pointer-events-none opacity-20">
              <div className="absolute -top-32 -left-32 w-96 h-96 bg-amber-600 rounded-full blur-[128px]" />
              <div className="absolute -bottom-32 -right-32 w-96 h-96 bg-yellow-600 rounded-full blur-[128px]" />
              <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full bg-[radial-gradient(#27272a_1px,transparent_1px)] [background-size:24px_24px] opacity-40" />
            </div>

            {/* Top Bar Navigation & Stats */}
            <header className="relative z-10 border-b border-zinc-800/80 bg-zinc-950/80 backdrop-blur-md px-4 sm:px-8 py-3.5 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-amber-700 p-0.5 flex items-center justify-center shadow-lg shadow-amber-950/40">
                  <div className="w-full h-full bg-zinc-950 rounded-[10px] flex items-center justify-center">
                    <Clapperboard className="w-5 h-5 text-amber-400" />
                  </div>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-base sm:text-lg font-black tracking-tight text-white flex items-center gap-1.5">
                      헐리우드 스타 <span className="text-amber-400 font-extrabold">타자 챌린지</span>
                    </h1>
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 font-medium">
                      STAGE {currentStageIdx + 1}/5
                    </span>
                  </div>
                  <p className="text-xs text-zinc-400">
                    배우 이름을 오타 없이 입력하면 +1점 획득!
                  </p>
                </div>
              </div>

              {/* Real-time stats display */}
              <div className="flex items-center gap-2 sm:gap-4">
                {/* Real-time CPM */}
                <div className="flex items-center gap-1.5 bg-zinc-900/90 border border-zinc-800 px-3 py-1.5 rounded-xl shadow-inner">
                  <Flame className="w-4 h-4 text-orange-400 animate-pulse" />
                  <div className="text-left">
                    <span className="text-[10px] uppercase block text-zinc-500 font-bold leading-none">타자 속도</span>
                    <span className="text-sm sm:text-base font-extrabold text-amber-400 font-mono">
                      {cpm} <span className="text-xs font-normal text-zinc-400">타/분</span>
                    </span>
                  </div>
                </div>

                {/* Accuracy */}
                <div className="hidden sm:flex items-center gap-1.5 bg-zinc-900/90 border border-zinc-800 px-3 py-1.5 rounded-xl">
                  <CheckCircle2 className="w-4 h-4 text-emerald-400" />
                  <div className="text-left">
                    <span className="text-[10px] uppercase block text-zinc-500 font-bold leading-none">정확도</span>
                    <span className="text-sm font-bold text-emerald-400 font-mono">{accuracy}%</span>
                  </div>
                </div>

                {/* Current Score */}
                <div className="flex items-center gap-1.5 bg-zinc-900/90 border border-amber-500/30 px-3 py-1.5 rounded-xl">
                  <Trophy className="w-4 h-4 text-amber-400" />
                  <div className="text-left">
                    <span className="text-[10px] uppercase block text-zinc-500 font-bold leading-none">점수</span>
                    <span className="text-sm sm:text-base font-black text-amber-400 font-mono">
                      {score} <span className="text-xs text-zinc-500 font-normal">/ {totalWords}</span>
                    </span>
                  </div>
                </div>

                {/* 🏆 명예의 전당 버튼 */}
                <button
                  onClick={() => setShowHallOfFame(true)}
                  title="명예의 전당 순위표 보기"
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-amber-500/50 bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 text-xs sm:text-sm font-bold shadow-[0_0_12px_rgba(245,158,11,0.2)] transition active:scale-95 cursor-pointer"
                >
                  <span>🏆</span>
                  <span className="hidden sm:inline">명예의 전당</span>
                </button>

                {/* BGM Loop Player Button */}
                <button
                  onClick={toggleBgm}
                  title={bgmPlaying ? "배경음악(BGM) 일시정지" : "배경음악(BGM) 반복 재생 (pixel-rush.mp3)"}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl border text-xs font-semibold transition cursor-pointer ${
                    bgmPlaying
                      ? "bg-amber-500/20 text-amber-300 border-amber-500/40 shadow-[0_0_12px_rgba(245,158,11,0.25)]"
                      : "bg-zinc-900/90 text-zinc-400 hover:text-white border-zinc-800"
                  }`}
                >
                  <Music className={`w-3.5 h-3.5 ${bgmPlaying ? "animate-pulse text-amber-400" : ""}`} />
                  <span className="hidden sm:inline">BGM</span>
                  <span className="text-[10px] font-mono">{bgmPlaying ? "ON" : "OFF"}</span>
                </button>

                {/* Sound Toggle */}
                <button
                  onClick={handleToggleSound}
                  aria-label="효과음 켜기/끄기"
                  title={soundEnabled ? "효과음 켜짐" : "효과음 꺼짐"}
                  className="p-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-white border border-zinc-800 transition cursor-pointer"
                >
                  {soundEnabled ? <Volume2 className="w-4 h-4 text-amber-400" /> : <VolumeX className="w-4 h-4" />}
                </button>
              </div>
            </header>

            {/* Main Content Area */}
            <main className="relative z-10 flex-1 flex flex-col items-center justify-center p-4 sm:p-6 max-w-4xl mx-auto w-full">
              {/* Stage Progress Timeline */}
              <div className="w-full max-w-2xl mb-6">
                <div className="flex items-center justify-between text-xs text-zinc-400 mb-2">
                  <span className="font-semibold text-amber-400 flex items-center gap-1.5">
                    <Film className="w-3.5 h-3.5" /> {currentStage.title}
                  </span>
                  <span className="font-mono text-zinc-300">
                    {currentWordIdx + 1} / 10 단어 (전체 {overallWordIndex}/{totalWords})
                  </span>
                </div>

                {/* 10-dots micro progress for current stage */}
                <div className="grid grid-cols-10 gap-1.5">
                  {Array.from({ length: 10 }).map((_, i) => {

                        {rankedRecords.length > 0 && (
                          <div className="bg-zinc-950/80 border border-zinc-800 rounded-2xl p-3 max-h-36 overflow-y-auto text-left mt-2">
                            <div className="text-[11px] font-bold text-amber-400 uppercase tracking-wider mb-1.5 flex items-center justify-between">
                              <span className="flex items-center gap-1">
                                <Trophy className="w-3.5 h-3.5" /> 명예의 전당 (Top {rankedRecords.length})
                              </span>
                              <span className="text-[10px] text-zinc-500 font-mono">점수순</span>
                            </div>
                            <div className="space-y-1">
                              {rankedRecords.slice(0, 5).map((rec, i) => {
                                const medal = rec.rank === 1 ? "🥇" : rec.rank === 2 ? "🥈" : rec.rank === 3 ? "🥉" : null;
                                return (
                                  <div
                                    key={rec.id || i}
                                    className={`flex items-center justify-between text-xs px-2.5 py-1.5 rounded-xl border transition-all ${
                                      rec.isMyRecent
                                        ? "bg-amber-500/25 border-amber-400 text-amber-200 ring-2 ring-amber-400/40 font-bold"
                                        : "text-zinc-300 bg-zinc-900/60 border-zinc-800/60"
                                    }`}
                                  >
                                    <div className="flex items-center gap-1.5 truncate">
                                      <span className="font-mono text-amber-400 font-bold w-10 shrink-0">
                                        {medal ? `${medal} ${rec.rank}위` : `${rec.rank}위`}
                                      </span>
                                      <span className="font-semibold truncate">{rec.name}</span>
                                      {rec.isMyRecent && (
                                        <span className="shrink-0 text-[9px] bg-amber-400 text-black px-1 rounded font-black">
                                          내 기록
                                        </span>
                                      )}
                                    </div>
                                    <div className="font-mono flex items-center gap-2 shrink-0">
                                      <span className="text-amber-300 font-bold">{rec.score}점</span>
                                      <span className="text-[10px] text-zinc-500">{rec.date}</span>
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 🏆 명예의 전당 모달 */}
            {showHallOfFame && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
                <div className="bg-zinc-900 border border-amber-500/50 rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl shadow-amber-500/10 flex flex-col max-h-[85vh] relative">
                  <div className="flex items-center justify-between pb-4 border-b border-zinc-800">
                    <div className="flex items-center gap-3">
                      <div className="w-11 h-11 rounded-2xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 shadow-md">
                        <Trophy className="w-6 h-6" />
                      </div>
                      <div>
                        <h3 className="text-xl sm:text-2xl font-black text-white flex items-center gap-2">
                          🏆 명예의 전당 <span className="text-xs px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40 font-bold">Top 10</span>
                        </h3>
                        <p className="text-xs text-zinc-400">
                          최고 점수 순위표 • 동점 시 먼저 기록한 순
                        </p>
                      </div>
                    </div>
                    <button
                      onClick={() => setShowHallOfFame(false)}
                      className="p-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-white transition cursor-pointer"
                      aria-label="닫기"
                    >
                      <X className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="flex-1 overflow-y-auto py-4 space-y-2">
                    {rankedRecords.length === 0 ? (
                      <div className="text-center py-16 text-zinc-500">
                        <Trophy className="w-14 h-14 mx-auto mb-3 opacity-30 text-amber-400" />
                        <p className="text-lg font-bold text-zinc-200">아직 기록이 없어요.</p>
                        <p className="text-sm text-zinc-400 mt-1">첫 번째 주인공이 되어 보세요!</p>
                      </div>
                    ) : (
                      <div className="space-y-2">
                        <div className="grid grid-cols-12 px-3 py-1.5 text-[11px] font-bold text-zinc-400 uppercase tracking-wider border-b border-zinc-800/80">
                          <span className="col-span-2 text-center">순위</span>
                          <span className="col-span-4">이름</span>
                          <span className="col-span-3 text-right">점수</span>
                          <span className="col-span-3 text-right">날짜</span>
                        </div>

                        {rankedRecords.map((item, index) => {
                          const medal = item.rank === 1 ? "🥇" : item.rank === 2 ? "🥈" : item.rank === 3 ? "🥉" : null;

                          return (
                            <div
                              key={item.id || index}
                              className={`grid grid-cols-12 items-center px-3.5 py-3 rounded-2xl border transition-all ${
                                item.isMyRecent
                                  ? "bg-amber-500/25 border-2 border-amber-400 text-amber-100 ring-2 ring-amber-400/40 shadow-[0_0_15px_rgba(245,158,11,0.3)] font-bold"
                                  : item.rank === 1
                                  ? "bg-amber-950/30 border-amber-500/40 text-zinc-100"
                                  : "bg-zinc-950/70 border-zinc-800/80 text-zinc-300"
                              }`}
                            >
                              <div className="col-span-2 text-center flex items-center justify-center gap-1 font-mono font-black text-sm sm:text-base">
                                {medal && <span className="text-base sm:text-lg">{medal}</span>}
                                <span className={item.rank <= 3 ? "text-amber-400 font-extrabold" : "text-zinc-400"}>
                                  {item.rank}위
                                </span>
                              </div>

                              <div className="col-span-4 font-bold truncate text-sm sm:text-base flex items-center gap-1.5">
                                <span className="text-white truncate">{item.name}</span>
                                {item.isMyRecent && (
                                  <span className="shrink-0 text-[10px] bg-amber-400 text-black px-1.5 py-0.5 rounded-full font-black">
                                    내 기록 ★
                                  </span>
                                )}
                              </div>

                              <div className="col-span-3 text-right font-mono font-black text-amber-400 text-base sm:text-lg">
                                {item.score} <span className="text-xs font-normal text-zinc-400">점</span>
                              </div>

                              <div className="col-span-3 text-right font-mono text-[11px] sm:text-xs text-zinc-400 truncate">
                                {item.date}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>

                  <div className="pt-4 border-t border-zinc-800 flex flex-col sm:flex-row items-center justify-between gap-3">
                    <div className="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                      <button
                        onClick={() => setShowClearConfirm(true)}
                        disabled={savedRecords.length === 0}
                        className={`flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3.5 py-2.5 rounded-xl text-sm font-bold border transition ${
                          savedRecords.length === 0
                            ? "bg-rose-950/20 text-rose-500/40 border-rose-900/30 cursor-not-allowed opacity-50"
                            : "bg-rose-600/20 hover:bg-rose-600/30 active:bg-rose-600/40 text-rose-400 hover:text-rose-300 border-rose-500/50 shadow-md shadow-rose-950/20 cursor-pointer"
                        }`}
                      >
                        <Trash2 className="w-4 h-4" />
                        <span>전체 기록 지우기</span>
                      </button>
                      <button
                        onClick={handleDownloadRanking}
                        disabled={savedRecords.length === 0}
                        title="기록을 JSON 파일로 다운로드합니다"
                        className={`flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3.5 py-2.5 rounded-xl text-sm font-bold border transition ${
                          savedRecords.length === 0
                            ? "bg-sky-950/20 text-sky-500/40 border-sky-900/30 cursor-not-allowed opacity-50"
                            : "bg-sky-600/20 hover:bg-sky-600/30 active:bg-sky-600/40 text-sky-300 hover:text-sky-200 border-sky-500/50 shadow-md shadow-sky-950/20 cursor-pointer"
                        }`}
                      >
                        <Download className="w-4 h-4" />
                        <span>기록 다운로드</span>
                      </button>
                    </div>
                    <button
                      onClick={() => setShowHallOfFame(false)}
                      className="w-full sm:w-auto px-6 py-2.5 bg-gradient-to-r from-amber-500 to-yellow-400 hover:from-amber-400 hover:to-yellow-300 text-zinc-950 text-sm font-black rounded-xl transition cursor-pointer shadow-md"
                    >
                      닫기
                    </button>
                  </div>

                  {showClearConfirm && (
                    <div className="absolute inset-0 z-30 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md rounded-3xl">
                      <div className="bg-zinc-900 border border-rose-500/60 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl shadow-rose-950/50 space-y-4">
                        <div className="w-12 h-12 bg-rose-500/20 border border-rose-500/40 rounded-2xl flex items-center justify-center mx-auto text-rose-400">
                          <Trash2 className="w-6 h-6" />
                        </div>
                        <div>
                          <h4 className="text-lg font-black text-white leading-snug">
                            모든 기록이 사라집니다. 정말 지울까요?
                          </h4>
                          <p className="text-xs text-zinc-400 mt-2 leading-relaxed">
                            기기에 저장된 모든 랭킹 데이터가 영구적으로 삭제됩니다.
                          </p>
                        </div>
                        <div className="flex items-center gap-2.5 pt-2">
                          <button
                            onClick={() => setShowClearConfirm(false)}
                            className="flex-1 py-2.5 px-4 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-sm font-bold rounded-xl border border-zinc-700 transition cursor-pointer"
                          >
                            취소
                          </button>
                          <button
                            onClick={handleClearAllRecords}
                            className="flex-1 py-2.5 px-4 bg-rose-600 hover:bg-rose-500 active:scale-95 text-white text-sm font-black rounded-xl shadow-lg shadow-rose-600/30 transition cursor-pointer"
                          >
                            지우기
                          </button>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* Footer info */}
            <footer className="relative z-10 border-t border-zinc-900 px-4 py-3 text-center text-xs text-zinc-500">
              헐리우드 스타 타자 게임 • 단계별 10단어 (총 5단계 50인) • 인지 심리학 기반 실시간 피드백 시스템
            </footer>
          </div>
        );
      }

      // Root render
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
